
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Bio-Data Form</title>

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>Student Bio-Data Form</h1>
        <p>Please fill in your details correctly.</p>
    </header>

    <main>
        <form id="biodata-form" action="#" method="post">

            <fieldset>
                <legend>Personal Information</legend>

                <div class="form-group">
                    <label for="full-name">Full Name:</label>
                    <input
                        type="text"
                        id="full-name"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="matric-number">Matriculation Number:</label>
                    <input
                        type="text"
                        id="matric-number"
                        name="matricNumber"
                        placeholder="Enter your matric number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="date-of-birth">Date of Birth:</label>
                    <input
                        type="date"
                        id="date-of-birth"
                        name="dateOfBirth"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="gender">Gender:</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select your gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Prefer not to say</option>
                    </select>
                </div>
            </fieldset>

            <fieldset>
                <legend>Academic Information</legend>

                <div class="form-group">
                    <label for="department">Department:</label>
                    <input
                        type="text"
                        id="department"
                        name="department"
                        placeholder="Enter your department"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="level">Level:</label>
                    <select id="level" name="level" required>
                        <option value="">Select your level</option>
                        <option value="100">100 Level</option>
                        <option value="200">200 Level</option>
                        <option value="300">300 Level</option>
                        <option value="400">400 Level</option>
                        <option value="500">500 Level</option>
                    </select>
                </div>
            </fieldset>

            <div class="form-actions">
                <button type="submit">Submit Form</button>
                <button type="reset">Clear Form</button>
            </div>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Student Bio-Data Form</p>
    </footer>
</body>
</html>
